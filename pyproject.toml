[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterimage"
version = "0.1.0"
description = "Find the photos your iPhone backup still remembers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Om Patel" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/omdkpatel810-ops/afterimage"

[project.scripts]
afterimage = "afterimage.cli:main"

[tool.setuptools]
packages = ["afterimage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.coverage.run]
source = ["afterimage"]
omit = ["afterimage/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter decides line length
